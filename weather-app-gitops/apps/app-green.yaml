apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weather-app-green
  namespace: argocd
spec:
  project: weather-project

  source:
    repoURL: https://github.com/avadhutpatil22/weather-app-gitops.git
    targetRevision: HEAD
    path: manifests/overlays/green

  destination:
    server: https://kubernetes.default.svc
    namespace: weather-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
